<!DOCTYPE html>
<html>
<head>
  <base href="/app/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="ICEBERG Study Center — student, teacher and admin portal.">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#071520">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ICEBERG">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>ICEBERG Study Center</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Reset browser text-decoration that leaks into Flutter's HTML renderer */
    * { text-decoration: none !important; }
    a, a:hover, a:visited { text-decoration: none !important; color: inherit; }

    /* Branded boot screen shown until Flutter takes over — deep glacier-navy
       backdrop that blends with the logo lockup so there is no white flash. */
    html, body { margin: 0; padding: 0; background: #071520; height: 100%; }
    #boot {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 26px;
      background: radial-gradient(120% 120% at 50% 42%, #11314e 0%, #0a1d31 45%, #060f1a 100%);
      transition: opacity .4s ease;
    }
    #boot .logo {
      position: relative;
      width: min(72vw, 340px); aspect-ratio: 1 / 1;
      border-radius: 30px; overflow: hidden;
      background: #0a1626;
      opacity: 0; transform: scale(.82) translateY(10px);
      animation: logoIn .8s cubic-bezier(.18, .9, .28, 1) forwards,
                 floaty 4.2s ease-in-out 1s infinite,
                 glow 3s ease-in-out .7s infinite;
    }
    #boot .logo svg { width: 72%; height: 72%; display: block; margin: auto; margin-top: 14%; }
    /* Sheen sweep across the logo. */
    #boot .logo::after {
      content: ""; position: absolute; inset: 0;
      background: linear-gradient(115deg, transparent 38%, rgba(120,210,255,.18) 50%, transparent 62%);
      transform: translateX(-130%);
      animation: sheen 3.4s ease-in-out 1.1s infinite;
    }
    #boot .bar {
      width: 132px; height: 4px; border-radius: 99px;
      background: rgba(146,196,232,.14); overflow: hidden;
      opacity: 0; animation: nameIn .5s ease-out .5s forwards;
    }
    #boot .bar i {
      display: block; width: 42%; height: 100%; border-radius: 99px;
      background: linear-gradient(90deg, #38BDF0, #8fe6ff);
      animation: slide 1.15s ease-in-out infinite;
    }
    @keyframes logoIn { to { opacity: 1; transform: scale(1) translateY(0); } }
    @keyframes nameIn { to { opacity: 1; } }
    @keyframes floaty { 0%,100% { translate: 0 0; } 50% { translate: 0 -6px; } }
    @keyframes sheen  { 0% { transform: translateX(-130%); } 55%,100% { transform: translateX(130%); } }
    @keyframes slide  { 0% { transform: translateX(-130%); } 100% { transform: translateX(320%); } }
    /* Gentle idle glow so a slightly longer load never looks frozen. */
    @keyframes glow {
      0%, 100% { box-shadow: 0 0 0 0 rgba(56,189,240,0); }
      50%      { box-shadow: 0 0 48px 6px rgba(56,189,240,.28); }
    }
  </style>
</head>
<body>
  <div id="boot">
    <div class="logo">
      <!-- Inline SVG mountain wireframe — no external file needed -->
      <svg viewBox="0 0 96 88" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="ICEBERG">
        <polyline points="3.84,80.96 48,3.52 92.16,80.96" stroke="#00CFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        <line x1="48" y1="3.52" x2="33.24" y2="54.23" stroke="#00CFFF" stroke-width="1" stroke-linecap="round" opacity="0.45"/>
        <line x1="48" y1="3.52" x2="18.48" y2="79.21" stroke="#00CFFF" stroke-width="1" stroke-linecap="round" opacity="0.45"/>
        <line x1="48" y1="3.52" x2="62.76" y2="54.23" stroke="#00CFFF" stroke-width="1" stroke-linecap="round" opacity="0.45"/>
        <line x1="48" y1="3.52" x2="77.52" y2="79.21" stroke="#00CFFF" stroke-width="1" stroke-linecap="round" opacity="0.45"/>
        <line x1="26.6"  y1="24.66" x2="69.4"  y2="24.66" stroke="#00CFFF" stroke-width="1" stroke-linecap="round" opacity="0.45"/>
        <line x1="14.94" y1="44.84" x2="81.06" y2="44.84" stroke="#00CFFF" stroke-width="1" stroke-linecap="round" opacity="0.45"/>
        <line x1="7.0"   y1="63.54" x2="89.0"  y2="63.54" stroke="#00CFFF" stroke-width="1" stroke-linecap="round" opacity="0.45"/>
        <line x1="3.84" y1="80.96" x2="92.16" y2="80.96" stroke="#00CFFF" stroke-width="1.4" opacity="0.7"/>
        <circle cx="48" cy="3.52" r="2.5" fill="#00CFFF"/>
        <text x="48" y="87" text-anchor="middle" font-family="system-ui,sans-serif" font-size="7" font-weight="800" letter-spacing="3" fill="white">ICEBERG</text>
      </svg>
    </div>
    <div class="bar"><i></i></div>
  </div>

  <script>
    // ── Service-worker recovery ────────────────────────────────────────────
    // Older builds registered a Flutter service worker that can serve a stale
    // main.dart.js and hang the boot after a redeploy (common on iOS Safari).
    // Unregister any existing worker + clear its caches once, then reload so
    // the current assets load fresh. Guarded so it never loops.
    (function () {
      if (!('serviceWorker' in navigator)) return;
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        if (!regs.length) return;
        var jobs = regs.map(function (r) { return r.unregister(); });
        if ('caches' in window) {
          jobs.push(caches.keys().then(function (keys) {
            return Promise.all(keys.map(function (k) { return caches.delete(k); }));
          }));
        }
        Promise.all(jobs).then(function () {
          if (!sessionStorage.getItem('ib-sw-cleared')) {
            sessionStorage.setItem('ib-sw-cleared', '1');
            location.reload();
          }
        });
      }).catch(function () {});
    })();

    // ── Boot safety net ────────────────────────────────────────────────────
    // If Flutter hasn't painted its first frame within 9s, reload once to
    // recover from a transient asset-load failure.
    var bootTimer = setTimeout(function () {
      if (!document.getElementById('boot')) return;      // already painted
      if (!sessionStorage.getItem('ib-boot-reloaded')) {
        sessionStorage.setItem('ib-boot-reloaded', '1');
        location.reload();
      }
    }, 9000);

    window.addEventListener('flutter-first-frame', function () {
      clearTimeout(bootTimer);
      sessionStorage.removeItem('ib-boot-reloaded');
      var el = document.getElementById('boot');
      if (el) { el.style.opacity = '0'; setTimeout(function(){ el.remove(); }, 360); }
    });

    // ── Shadow-DOM underline fix ───────────────────────────────────────────
    // Flutter web's HTML renderer puts all content inside a <flt-glass-pane>
    // shadow root.  The outer `* { text-decoration: none }` CSS cannot cross
    // that boundary, so we inject the same rule directly into the shadow root
    // once Flutter has mounted the element.
    (function () {
      var CSS_ID = 'ib-no-underline';
      var CSS_TEXT = '* { text-decoration: none !important; } a { color: inherit; }';

      function injectIntoShadow(root) {
        if (!root || root.getElementById && root.getElementById(CSS_ID)) return;
        if (root.querySelector && root.querySelector('#' + CSS_ID)) return;
        var s = document.createElement('style');
        s.id = CSS_ID;
        s.textContent = CSS_TEXT;
        root.appendChild(s);
      }

      function scanForFlutterRoot() {
        // flt-glass-pane is Flutter's top-level custom element (HTML renderer)
        var panes = document.querySelectorAll('flt-glass-pane');
        panes.forEach(function (p) {
          if (p.shadowRoot) injectIntoShadow(p.shadowRoot);
        });
        // Also cover the flt-scene / flt-canvas-container shadow roots
        document.querySelectorAll('[id^="flt-"]').forEach(function (el) {
          if (el.shadowRoot) injectIntoShadow(el.shadowRoot);
        });
      }

      // Run immediately, then watch for the element to appear
      scanForFlutterRoot();
      var mo = new MutationObserver(scanForFlutterRoot);
      mo.observe(document.body, { childList: true, subtree: true });
      // Stop watching after 10 s — Flutter is fully up by then
      setTimeout(function () { mo.disconnect(); }, 10000);
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
