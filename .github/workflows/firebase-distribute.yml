name: Firebase App Distribution

# Runs automatically on every push to main, and can be triggered manually.
# On manual trigger you can override the release notes.
on:
  push:
    branches: [main]
    paths:
      # Only rebuild when mobile code or this workflow changes
      - 'mobile/iceberg_app/**'
      - '.github/workflows/firebase-distribute.yml'
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Release notes shown to testers'
        required: false
        default: ''

# ---------------------------------------------------------------------------
# Required GitHub Secrets (Settings → Secrets and variables → Actions):
#
#   FIREBASE_APP_ID            — Android app ID from Firebase Console
#                                Format: 1:123456789012:android:abcdef1234
#                                Firebase Console → Project settings → Your apps
#
#   FIREBASE_SERVICE_ACCOUNT   — Service account JSON key (entire file content)
#                                Google Cloud Console → IAM → Service Accounts
#                                Role: Firebase App Distribution Admin
# ---------------------------------------------------------------------------

jobs:
  distribute:
    name: Build & distribute to Firebase
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Flutter pub get
        working-directory: mobile/iceberg_app
        run: flutter pub get

      - name: Build APKs (split per ABI)
        working-directory: mobile/iceberg_app
        run: flutter build apk --release --split-per-abi

      - name: Determine release notes
        id: notes
        run: |
          NOTES="${{ github.event.inputs.release_notes }}"
          if [[ -z "$NOTES" ]]; then
            NOTES="$(git log -1 --pretty=format:'%s')"
          fi
          echo "text=$NOTES" >> "$GITHUB_OUTPUT"

      - name: Distribute arm64 APK (modern phones)
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          file: mobile/iceberg_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          releaseNotes: "${{ steps.notes.outputs.text }} [arm64]"

      - name: Distribute arm32 APK (older phones)
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          file: mobile/iceberg_app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          releaseNotes: "${{ steps.notes.outputs.text }} [arm32]"

      - name: Upload artifacts (30-day retention)
        uses: actions/upload-artifact@v4
        with:
          name: iceberg-apks
          path: |
            mobile/iceberg_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            mobile/iceberg_app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          retention-days: 30
